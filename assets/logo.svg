  </g>
  <text x="150" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#f2f6fa" letter-spacing="1">NOVARK<tspan fill="#4fd6ff">LAB</tspan></text>
  <text x="152" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#9fb3c8" letter-spacing="3">PRECISIONE MECCANICA</text>
